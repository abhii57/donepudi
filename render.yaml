services:
  - type: web
    name: pulsewire-news
    runtime: docker
    plan: starter
    healthCheckPath: /api/articles
    disk:
      name: pulsewire-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MSG91_AUTHKEY
        sync: false
